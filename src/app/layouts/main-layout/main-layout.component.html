<div class="main-layout">

  <!-- GLOBAL HEADER -->
  <header class="app-header">
    <div class="header-left">
      <a routerLink="/dashboard" class="logo">
        <div class="logo-icon">F</div>
        <span class="logo-text">FlowBoard</span>
      </a>
      <div class="search-wrapper">
        <mat-icon class="search-icon">search</mat-icon>
        <input type="text" placeholder="Search boards, cards..." class="search-input" />
      </div>
    </div>

    <div class="header-right">
      <!-- Upgrade CTA for free users -->
      <a *ngIf="isFreeUser()" routerLink="/pricing" class="upgrade-pill">
        <mat-icon>workspace_premium</mat-icon>
        <span>Upgrade</span>
      </a>

      <!-- Current plan badge for paid users -->
      <a *ngIf="!isFreeUser()" routerLink="/pricing" class="plan-badge">
        <mat-icon>workspace_premium</mat-icon>
        <span class="hidden sm:inline">{{ planName() }}</span>
      </a>

      <app-notification-center></app-notification-center>

      <button mat-icon-button class="icon-btn" matTooltip="Toggle Dark Mode" (click)="toggleTheme()">
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <!-- USER MENU -->
      <button mat-button [matMenuTriggerFor]="userMenu" class="profile-btn">
        <div class="avatar" [style.background]="(user$ | async)?.avatarUrl ? 'url(' + (user$ | async)!.avatarUrl + ') center/cover' : ''">
          {{ (user$ | async)?.avatarUrl ? '' : ((user$ | async)?.fullName?.[0] || 'U') }}
        </div>
        <span class="user-name">{{ (user$ | async)?.fullName || 'User' }}</span>
        <mat-icon class="chevron">expand_more</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <div class="menu-header">
          <p class="menu-label">Signed in as</p>
          <p class="menu-email">{{ (user$ | async)?.email }}</p>
          <p class="menu-plan" [ngClass]="{'plan-pro': !isFreeUser()}">
            {{ planName() }} Plan
          </p>
        </div>
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person_outline</mat-icon> My Profile
        </button>
        <button mat-menu-item routerLink="/pricing">
          <mat-icon>workspace_premium</mat-icon> 
          {{ isFreeUser() ? 'Upgrade Plan' : 'Manage Subscription' }}
        </button>
        <button mat-menu-item *ngIf="authService.isAdmin()" routerLink="/admin">
          <mat-icon>admin_panel_settings</mat-icon> Admin Dashboard
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon> Sign Out
        </button>
      </mat-menu>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="page-body">
    <router-outlet></router-outlet>
  </main>

</div>
