<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-icon">
        <span style="font-size:18px">⚡</span>
      </div>
      <span class="logo-text">FlowBoard</span>
    </div>

    <h1 class="auth-title">Sign in to your workspace</h1>


    <div *ngIf="errorMessage" class="auth-error">
      <mat-icon style="font-size:16px;width:16px;height:16px">error</mat-icon>
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <label class="custom-label">Email address</label>
      <mat-form-field appearance="outline">
        <input matInput formControlName="email"
               type="email" placeholder="you&#64;example.com" />
        <mat-error *ngIf="email.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="email.hasError('email')">
          Enter a valid email
        </mat-error>
      </mat-form-field>

      <label class="custom-label">Password</label>
      <mat-form-field appearance="outline">
        <input matInput formControlName="password"
               [type]="hidePassword ? 'password' : 'text'" placeholder="Enter your password" />
        <button mat-icon-button matSuffix type="button"
                (click)="hidePassword = !hidePassword">
          <mat-icon>
            {{ hidePassword ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>
        <mat-error *ngIf="password.hasError('required')">
          Password is required
        </mat-error>
        <mat-error *ngIf="password.hasError('minlength')">
          Minimum 6 characters
        </mat-error>
      </mat-form-field>

      <div style="text-align:right;margin-bottom:16px">
        <button type="button" class="link-btn"
                (click)="goToForgotPassword()">
          Forgot password?
        </button>
      </div>

      <button mat-flat-button class="submit-btn"
              type="submit" [disabled]="loading || form.invalid">
        <mat-spinner *ngIf="loading" diameter="20"
                     style="display:inline-block;margin-right:8px">
        </mat-spinner>
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>

    </form>
    <!-- Add after the form closing tag and before auth-footer -->
<div class="divider">
  <span>or</span>
</div>

<a class="google-btn"
   href="http://localhost:8081/oauth2/authorization/google">
  <svg width="18" height="18" viewBox="0 0 18 18">
    <path fill="#4285F4"
      d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209
         1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567
         2.684-3.875 2.684-6.615z"/>
    <path fill="#34A853"
      d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54
         -1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332
         C2.438 15.983 5.482 18 9 18z"/>
    <path fill="#FBBC05"
      d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71
         s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348
         2.827.957 4.042l3.007-2.332z"/>
    <path fill="#EA4335"
      d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891
         11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29
         C4.672 5.163 6.656 3.58 9 3.58z"/>
  </svg>
  Continue with Google
</a>

    <div class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </div>

  </div>
</div>
