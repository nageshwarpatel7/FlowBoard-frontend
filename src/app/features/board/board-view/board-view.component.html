<div class="board-layout"
     [style.background]="board?.background || '#4f46e5'">
  
  <div class="board-background-overlay"></div>

  <!-- Board Toolbar -->
  <div class="board-toolbar glass">
    <div class="toolbar-left">
      <button mat-icon-button (click)="goBack()" class="back-btn">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="board-info">
        <h1 class="board-title">{{ board?.name || 'Loading...' }}</h1>
        <div class="board-meta">
           <button mat-button [matMenuTriggerFor]="visibilityMenu" class="visibility-btn">
             <mat-icon>{{ board?.visibility === 'PUBLIC' ? 'public' : 'lock' }}</mat-icon>
             {{ board?.visibility | titlecase }}
             <mat-icon class="chevron">expand_more</mat-icon>
           </button>
           <mat-menu #visibilityMenu="matMenu" class="modern-menu">
             <button mat-menu-item (click)="updateVisibility('PRIVATE')">
               <mat-icon>lock</mat-icon> Private
             </button>
             <button mat-menu-item (click)="updateVisibility('PUBLIC')">
               <mat-icon>public</mat-icon> Public
             </button>
           </mat-menu>
           <span *ngIf="board?.isClosed" class="closed-chip">Closed</span>
        </div>
      </div>
    </div>

    <div class="toolbar-right">
      <div class="member-stack">
        <div class="m-dot">U</div>
        <div class="m-dot plus">+</div>
      </div>
      <button mat-flat-button class="share-btn">
         <mat-icon>person_add</mat-icon> Share
      </button>
      <button mat-icon-button [matMenuTriggerFor]="boardActionsMenu" class="more-btn">
        <mat-icon>more_horiz</mat-icon>
      </button>

        <mat-menu #boardActionsMenu="matMenu" class="modern-menu">
          <button mat-menu-item (click)="showAnalytics = true"><mat-icon>analytics</mat-icon> Analytics</button>
          <button mat-menu-item (click)="showArchive = true"><mat-icon>archive</mat-icon> Archived Items</button>
          <mat-divider></mat-divider>
          <button mat-menu-item class="delete-item" (click)="deleteBoard()">
            <mat-icon>delete</mat-icon> Delete Board
          </button>
        </mat-menu>
    </div>
  </div>

  <!-- Kanban area -->
  <div class="kanban-area">

    <!-- Skeleton Loaders -->
    <ng-container *ngIf="loading">
      <div class="lists-container">
        <div class="skeleton-list" *ngFor="let i of [1,2,3,4]">
          <div class="skeleton-box skeleton-title"></div>
          <div class="skeleton-box skeleton-card" style="height: 100px;"></div>
          <div class="skeleton-box skeleton-card" style="height: 140px;"></div>
          <div class="skeleton-box skeleton-card" style="height: 80px;"></div>
        </div>
      </div>
    </ng-container>

    <!-- Lists container — horizontal drag-and-drop -->
    <div *ngIf="!loading"
         cdkDropList
         cdkDropListOrientation="horizontal"
         [cdkDropListData]="lists"
         (cdkDropListDropped)="onListDrop($event)"
         class="lists-container">

      <!-- Each list column (only if NOT archived) -->
      <ng-container *ngFor="let list of lists">
        <div *ngIf="!list.isArchived"
             cdkDrag
             [cdkDragData]="list"
             class="list-column-wrapper">
          
          <div class="list-column glass">
            <!-- List header -->
            <div class="list-header" cdkDragHandle>
              <div class="list-header-left">
                <span class="list-color-dot" *ngIf="list.color" [style.background]="list.color"></span>
                <span class="list-name">{{ list.name }}</span>
                <span class="list-count">{{ getCards(list.id).length }}</span>
              </div>

              <div style="display: flex;">
                <app-color-picker [selectedColor]="list.color || null" (colorChange)="updateListColor(list, $event)"></app-color-picker>
                <button mat-icon-button class="list-menu-btn" [matMenuTriggerFor]="listMenu">
                  <mat-icon>more_vert</mat-icon>
                </button>
              </div>

              <mat-menu #listMenu="matMenu" class="modern-menu">
                <button mat-menu-item (click)="archiveList(list.id)">
                  <mat-icon>archive</mat-icon> Archive
                </button>
                <button mat-menu-item class="delete-item" (click)="deleteList(list.id)">
                  <mat-icon>delete</mat-icon> Delete
                </button>
              </mat-menu>
            </div>

            <!-- Cards drop zone -->
            <div cdkDropList
                [id]="'list-' + list.id"
                [cdkDropListData]="getCards(list.id)"
                [cdkDropListConnectedTo]="getConnectedLists()"
                (cdkDropListDropped)="onCardDrop($event, list.id)"
                class="cards-container">

              <!-- Card item (only if NOT archived) -->
              <ng-container *ngFor="let card of getCards(list.id)">
                <div *ngIf="!card.isArchived"
                    cdkDrag
                    [cdkDragData]="card"
                    class="card-item-wrapper"
                    (click)="openCardDetail(card)">
                  
                  <div class="card-item" 
                       [class.overdue]="card.isOverdue">
                    
                    <div *ngIf="card.coverColor"
                        class="card-cover"
                        [style.background]="card.coverColor">
                    </div>

                    <div class="card-body">
                      <p class="card-title">{{ card.title }}</p>

                      <div class="card-meta">
                        <span class="priority-badge" [style.background]="getPriorityColor(card.priority) + '20'" [style.color]="getPriorityColor(card.priority)">
                           {{ card.priority | titlecase }}
                        </span>

                        <div class="spacer"></div>

                        <div class="indicators">
                          <span *ngIf="card.dueDate" class="indicator due" [class.is-overdue]="card.isOverdue">
                            <mat-icon>schedule</mat-icon>
                            {{ card.dueDate | date:'MMM d' }}
                          </span>
                          <mat-icon *ngIf="card.description" class="indicator" matTooltip="Has description">notes</mat-icon>
                        </div>
                      </div>
                    </div>

                    <div *cdkDragPlaceholder class="card-placeholder"></div>
                  </div>
                </div>
              </ng-container>

            </div>

            <!-- Add card button -->
            <div class="list-footer">
              <ng-container *ngIf="!showCardDetail">
                <app-card-create
                  *ngIf="list.id === activeAddCardListId"
                  [listId]="list.id"
                  [boardId]="board!.id"
                  (cardCreated)="onCardCreated($event, list.id); activeAddCardListId = null"
                  (cancelled)="activeAddCardListId = null">
                </app-card-create>

                <button *ngIf="list.id !== activeAddCardListId"
                        mat-button class="add-card-btn"
                        (click)="activeAddCardListId = list.id">
                  <mat-icon>add</mat-icon> Add a card
                </button>
              </ng-container>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Add list panel -->
    <div class="add-list-panel" *ngIf="!loading">
      <div *ngIf="showAddList" class="add-list-form glass">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>List name</mat-label>
          <input matInput [formControl]="$any(listForm.get('name'))"
                 (keydown.enter)="addList()"
                 (keydown.escape)="showAddList = false"
                 placeholder="e.g. In Progress"
                 autofocus />
        </mat-form-field>
        <div class="add-list-actions">
          <button mat-flat-button color="primary"
                  (click)="addList()"
                  [disabled]="addingList || listForm.invalid">
            {{ addingList ? 'Adding...' : 'Add list' }}
          </button>
          <button mat-icon-button (click)="showAddList = false; listForm.reset()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>

      <button *ngIf="!showAddList" class="add-list-btn glass" (click)="showAddList = true">
        <mat-icon>add</mat-icon>
        Add another list
      </button>
    </div>

  </div>

  <!-- Card detail overlay -->
  <div *ngIf="showCardDetail && selectedCard"
       class="card-detail-overlay"
       (click)="closeCardDetail()">
    <div class="card-detail-panel" (click)="$event.stopPropagation()">
      <app-card-detail
        [card]="selectedCard"
        (cardUpdated)="onCardUpdated($event)"
        (cardDeleted)="onCardDeleted($event)"
        (closed)="closeCardDetail()">
      </app-card-detail>
    </div>
  </div>

  <!-- Analytics Overlay -->
  <div *ngIf="showAnalytics && board" class="card-detail-overlay" (click)="showAnalytics = false">
    <div class="card-detail-panel" (click)="$event.stopPropagation()">
      <app-board-analytics [board]="board" [allCards]="getAllCards()"></app-board-analytics>
    </div>
  </div>

  <!-- Archive Overlay -->
  <div *ngIf="showArchive" class="card-detail-overlay" (click)="showArchive = false">
    <div class="card-detail-panel side-panel" (click)="$event.stopPropagation()">
      <app-archive-manager
        [archivedCards]="getArchivedCards()"
        [archivedLists]="getArchivedLists()"
        (restoreCard)="restoreCard($event)"
        (restoreList)="restoreList($event)"
        (closed)="showArchive = false">
      </app-archive-manager>
    </div>
  </div>

</div>
